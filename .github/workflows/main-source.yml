# Only the `test` branch of this repository may be merged into `main`.
# Required as a status check by the branch protection on `main`.
#
# Uses pull_request_target so the workflow definition always comes from `main` (the base branch).
# A pull request cannot weaken or replace it. It never checks out or runs any pull request code.
name: Main source check

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  only-from-test:
    name: Only test may merge into main
    runs-on: ubuntu-latest
    steps:
      - name: Check the source branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "::error::Pull requests from forks cannot target main. Open the pull request against the dev branch instead."
            exit 1
          fi
          if [ "$HEAD_REF" != "test" ]; then
            echo "::error::Only the test branch may be merged into main (this pull request comes from '$HEAD_REF'). Open pull requests against dev."
            exit 1
          fi
          echo "OK: test -> main"
